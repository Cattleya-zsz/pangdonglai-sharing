<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课堂演示 · 胖东来分配实验</title>
  <style>
    :root{color-scheme:light;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#662829;background:#fcf5f1}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{display:grid;grid-template-rows:28px minmax(0,1fr) 32px}
    .guide{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;background:#662829;color:#fff;font-size:13px;line-height:1.3;white-space:nowrap}
    .guide strong{font-weight:600}
    .guide a{color:#fff;text-decoration:none}
    .guide a:hover,.guide a:focus-visible{text-decoration:underline}
    .guide .back{opacity:.85}
    .steps{display:flex;align-items:center;justify-content:center;padding:0 14px;background:#662829;color:#fff;font-size:14px;white-space:nowrap}
    iframe{border:0;width:100%;height:100%;display:block;background:#fcf5f1}
    @media(max-width:1000px){.guide{font-size:11px;padding:0 12px;gap:8px}.guide .detail{display:none}}
  </style>
</head>
<body>
  <header class="guide" aria-label="演示说明">
    <strong>A 20%：教学假设 · B 95%：历史自述简化<span class="detail"> · 不是剩余价值率</span></strong>
    <span><a href="index.html#sim" target="_blank" rel="noopener">原版资料 ↗</a><span class="back">　Esc 退出全屏</span></span>
  </header>
  <iframe title="胖东来与全球分红：课堂模式分配实验" src="classroom-app.html#sim" allow="fullscreen" allowfullscreen></iframe>
  <footer class="steps">45秒演示：1000万元 / 100人 / B 95% → B 改50%（5万元/人）→ 恢复95% → Alt+Tab 回 PPT</footer>
</body>
</html>
